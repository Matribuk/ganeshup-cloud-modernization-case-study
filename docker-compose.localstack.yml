services:
  localstack:
    container_name: ganeshup-localstack
    image: localstack/localstack:4.14.0
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - SERVICES=s3,secretsmanager,events,lambda,iam,logs
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./.localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  postgres-rds:
    container_name: ganeshup-rds-postgres
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=ganeshup_user
      - POSTGRES_PASSWORD=local_rds_password
      - POSTGRES_DB=ganeshup_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganeshup_user -d ganeshup_db"]
      interval: 5s
      timeout: 5s
      retries: 5